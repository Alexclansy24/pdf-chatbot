services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pdf-chatbot-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest

    container_name: pdf-chatbot-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: